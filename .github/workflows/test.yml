name: Test

on:
  workflow_call:
    inputs:
      project:
        description: Xcode project file, e.g. Lucid.xcodeproj
        required: true
        type: string
      scheme:
        description: Xcode scheme to test
        required: true
        type: string

jobs:
  test:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
        run: xcodebuild test -project "$PROJECT" -scheme "$SCHEME" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
